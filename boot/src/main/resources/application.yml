spring:
  application:
    name: orderflow

  datasource:
    url: jdbc:h2:mem:orderflowdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    # driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
      format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/orderflow-realm

logging:
  level:
    root: INFO
    com.mfpe: DEBUG